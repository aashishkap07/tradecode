# OMEGA V60 — log rotation  [C467-D]
#
# Running 24x7 means the detail log grows without limit. One 11-hour session
# produced a 2.8 MB detail log; a month of continuous running is roughly 200 MB,
# which will fill a small free-tier disk and then the bot cannot write at all.
#
# Install:  sudo cp omega-logrotate.conf /etc/logrotate.d/omega
# Test it:  sudo logrotate -d /etc/logrotate.d/omega     (dry run, changes nothing)

/home/omega/omega/omega_detail_*.log
/home/omega/omega/omega_session_*.log
{
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    su omega omega
}

# The REPORT log is the one you actually read, it is small (about 28 KB a
# session), and losing it loses the record of every trade. Kept far longer.
/home/omega/omega/omega_report_*.log
{
    weekly
    rotate 26
    compress
    missingok
    notifempty
    copytruncate
    su omega omega
}
